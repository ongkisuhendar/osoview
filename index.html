<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>OSO View - Secure</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>*{user-select:none!important} body{background:#080c14;color:#e5e7eb;font-family:monospace} canvas{display:block} @media print{body{display:none}}</style>
</head><body oncontextmenu="return false">

<script>
// === ENCRYPTED DOCS - LINK ASLI TIDAK KELIHATAN DI VIEW SOURCE ===
// Ganti nilai ENC_* dengan hasil enkripsi dari tool enkripsi di bawah
const _k = "OSO-Tasikmalaya-CDI-2026"; // kunci enkripsi, ganti sesukamu
function _d(enc){
  try{
    let bin = atob(enc);
    let out="";
    for(let i=0;i<bin.length;i++) out+=String.fromCharCode(bin.charCodeAt(i) ^ _k.charCodeAt(i % _k.length));
    return out;
  }catch{return ""}
}

// Link terenkripsi - yang terlihat di HTML cuma ini, bukan link aslinya
const ENC_DOCS = {
  pdfs: [
    { name: "CDI STM32 Schematic Rev1", enc: "Jyc7XSdbXEYPHwgaBFcGQiwjJUgcU11bYDUmQTFOF0ZaClY+DSYzYRMQCk9+WFpDfCYqQxcyAAY9Az5VWStWSjRrP0RXRw1DPCNyXjwAAQAFCg==" },
    // tambah: { name: "V2", enc: "xxx" },
  ],
  images: [
    { name: "PCB Layout CDI", enc: "Jyc7XSdbXEYPHwgaBFcGQiwjJUgcU11bYDUmQTFOF0ZaKQM/BDs+ew4jKHJFYH5jJzYWex8MCQQPBjgJIgspQTdrP0RXRw1DPCNyXjwAAQAFCg==" },
  ]
};

function getDocs(){
  return {
    pdfs: ENC_DOCS.pdfs.map(p=>({name:p.name, url:_d(p.enc)})),
    images: ENC_DOCS.images.map(p=>({name:p.name, url:_d(p.enc)}))
  };
}
</script>

<!-- SISA VIEWER SAMA SEPERTI SEBELUMNYA TAPI PAKAI getDocs() -->
<div class="min-h-screen flex flex-col">
<header class="h-14 border-b border-white/10 bg-[#0e1420] flex items-center justify-between px-4 sticky top-0 z-50">
<div class="flex items-center gap-3"><div class="w-8 h-8 rounded bg-amber-500/20 border border-amber-500/30 flex items-center justify-center">OSO</div><div><p class="text-sm font-bold tracking-widest">OSOVIEW SECURE</p><p class="text-[10px] text-zinc-500">ENCRYPTED SOURCE • NO COPY</p></div></div>
<span class="text-[9px] px-2 py-1 rounded-full bg-emerald-500/10 border border-emerald-500/20 text-emerald-300">ENCRYPTED MODE</span>
</header>

<div class="flex border-b border-white/5 bg-[#0b101b]">
<button id="tab-pdf" onclick="switchTab('pdf')" class="px-6 py-3 text-xs font-bold border-b-2 border-amber-400 text-amber-300">PDF</button>
<button id="tab-img" onclick="switchTab('img')" class="px-6 py-3 text-xs font-bold border-b-2 border-transparent text-zinc-500">IMAGE</button>
</div>

<div class="flex flex-1 overflow-hidden">
<div class="w-[300px] border-r border-white/5 bg-[#0a0e18] p-3 overflow-auto">
<div id="list-pdf"><p class="text-[10px] text-zinc-500 mb-2">PDF LIST (terenkripsi)</p><div id="pdfList" class="space-y-2"></div></div>
<div id="list-img" class="hidden"><p class="text-[10px] text-zinc-500 mb-2">IMAGE LIST</p><div id="imgList" class="grid grid-cols-2 gap-2"></div></div>
</div>

<div class="flex-1 relative bg-[#070a12] flex flex-col overflow-hidden">
<div id="pdfContainer" class="flex-1 overflow-auto p-6 flex flex-col items-center gap-4"></div>
<iframe id="pdfFallback" class="hidden w-full h-[80vh]"></iframe>
<div id="view-img" class="hidden flex-1 overflow-auto p-4 flex flex-col items-center"><div id="imgWrap" class="relative bg-[#0f141e] rounded-xl border border-white/10 min-h-[500px] flex items-center justify-center w-full max-w-4xl"><canvas id="imgCanvas" class="max-w-full"></canvas><p id="imgPh" class="absolute text-xs text-zinc-500">Pilih gambar</p></div></div>
<div id="blurOverlay" class="hidden absolute inset-0 z-[60] bg-[#04070c]/80 backdrop-blur-[20px] flex items-center justify-center"><p class="text-amber-300 font-bold">SCREENSHOT BLOCKED</p></div>
</div>
</div>
</div>

<!-- TOOL ENKRIPSI DI BAWAH (hanya kamu yang pakai, bisa dihapus pas deploy) -->
<div class="border-t border-amber-500/20 bg-[#0b101a] p-4">
<p class="text-xs font-bold text-amber-300 mb-2">🔐 TOOL ENKRIPSI LINK (hapus div ini sebelum publish kalau mau)</p>
<div class="flex gap-2"><input id="encIn" placeholder="Paste link Drive asli di sini..." class="flex-1 bg-black/40 border border-white/10 rounded-full px-3 py-1.5 text-[11px]"><button onclick="doEnc()" class="px-4 py-1.5 rounded-full bg-amber-500/20 border border-amber-500/30 text-xs">Enkripsi</button></div>
<p id="encOut" class="mt-2 text-[11px] text-zinc-400 break-all"></p>
<p class="text-[10px] text-zinc-600 mt-1">Copy hasil enkripsi → paste ke ENC_DOCS di atas. Di View Source orang cuma lihat kode acak.</p>
</div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
function extractId(url){ let m=url.match(/\/d\/([a-zA-Z0-9_-]+)/); if(m) return m[1]; m=url.match(/[?&]id=([a-zA-Z0-9_-]+)/); return m?m[1]:null; }
function driveThumb(id){ return `https://drive.google.com/thumbnail?id=${id}&sz=w2000`; }
function drivePreview(id){ return `https://drive.google.com/file/d/${id}/preview`; }
function switchTab(t){
  document.getElementById('tab-pdf').className = t==='pdf' ? 'px-6 py-3 text-xs font-bold border-b-2 border-amber-400 text-amber-300' : 'px-6 py-3 text-xs font-bold border-b-2 border-transparent text-zinc-500';
  document.getElementById('tab-img').className = t==='img' ? 'px-6 py-3 text-xs font-bold border-b-2 border-amber-400 text-amber-300' : 'px-6 py-3 text-xs font-bold border-b-2 border-transparent text-zinc-500';
  document.getElementById('pdfContainer').parentElement.classList.toggle('hidden', false);
  document.getElementById('view-img').classList.toggle('hidden', t!=='img');
  document.getElementById('pdfContainer').classList.toggle('hidden', t!=='img');
  document.getElementById('pdfFallback').classList.add('hidden');
  if(t==='pdf') document.getElementById('pdfContainer').classList.remove('hidden'); else document.getElementById('pdfContainer').classList.add('hidden');
  document.getElementById('list-pdf').classList.toggle('hidden', t!=='pdf');
  document.getElementById('list-img').classList.toggle('hidden', t!=='img');
}
let DOCS=getDocs();
function build(){
  let pdfList=document.getElementById('pdfList'); pdfList.innerHTML='';
  DOCS.pdfs.forEach(p=>{ let id=extractId(p.url); let d=document.createElement('div'); d.className='p-2 rounded bg-white/[0.04] border border-white/10 cursor-pointer hover:bg-white/[0.06]'; d.innerHTML=`<p class="text-[12px] truncate">${p.name}</p><p class="text-[9px] text-zinc-600">enc:${p.url.length>0?'*** hidden ***':'empty'}</p>`; d.onclick=()=>loadPdf(id); pdfList.appendChild(d); });
  let imgList=document.getElementById('imgList'); imgList.innerHTML='';
  DOCS.images.forEach((p,i)=>{ let id=extractId(p.url); let w=document.createElement('div'); w.className='rounded border border-white/10 overflow-hidden cursor-pointer'; w.innerHTML=`<div class="aspect-[4/3] bg-black/30"><img src="${driveThumb(id)}" class="w-full h-full object-cover"></div><p class="text-[10px] p-1 truncate">${p.name}</p>`; w.onclick=()=>openImg(i); imgList.appendChild(w); });
}
async function loadPdf(id){
  let c=document.getElementById('pdfContainer'); c.innerHTML='<p class="text-xs text-zinc-400">Loading...</p>';
  try{ let url=`https://drive.usercontent.google.com/download?id=${id}&export=download&confirm=t`; let r=await fetch(url); let buf=await r.arrayBuffer(); let doc=await pdfjsLib.getDocument({data:buf}).promise; c.innerHTML=''; for(let i=1;i<=doc.numPages;i++){ let pg=await doc.getPage(i); let vp=pg.getViewport({scale:1.3}); let cv=document.createElement('canvas'); cv.width=vp.width; cv.height=vp.height; cv.style.width='100%'; cv.className='mb-4'; await pg.render({canvasContext:cv.getContext('2d'), viewport:vp}).promise; c.appendChild(cv);} }catch{ c.classList.add('hidden'); let f=document.getElementById('pdfFallback'); f.classList.remove('hidden'); f.src=drivePreview(id); }
}
async function openImg(i){
  switchTab('img');
  let p=DOCS.images[i]; let id=extractId(p.url);
  let canvas=document.getElementById('imgCanvas'); let ctx=canvas.getContext('2d'); document.getElementById('imgPh').classList.add('hidden');
  try{ let r=await fetch(driveThumb(id)); let b=await r.blob(); let bmp=await createImageBitmap(b); canvas.width=bmp.width; canvas.height=bmp.height; ctx.drawImage(bmp,0,0);}catch{}
}
function doEnc(){
  let url=document.getElementById('encIn').value.trim(); if(!url) return;
  let enc=btoa([...url].map((ch,i)=>String.fromCharCode(ch.charCodeAt(0) ^ _k.charCodeAt(i % _k.length))).join(''));
  document.getElementById('encOut').textContent = enc;
}
document.addEventListener('keydown', e=>{ if(e.key==='PrintScreen' || (e.ctrlKey && ['c','s','p'].includes(e.key.toLowerCase()))){ e.preventDefault(); let b=document.getElementById('blurOverlay'); b.classList.remove('hidden'); setTimeout(()=>b.classList.add('hidden'),2000);} });
build();
</script>
</body></html>
